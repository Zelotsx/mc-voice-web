<!DOCTYPE html>
<html>
<head>
    <title>Sybtown Voice</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        input { padding: 10px; border-radius: 5px; border: none; width: 200px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { margin-top: 20px; color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎤 Sybtown Voice Connect</h1>
    <input id="username" type="text" placeholder="ชื่อในเกมของคุณ...">
    <br>
    <button id="connectBtn">เชื่อมต่อไมค์</button>
    <p id="status">สถานะ: รอการเชื่อมต่อ</p>
    <div id="audio-container"></div> <script>
        const socket = io();
        const btn = document.getElementById('connectBtn');
        const status = document.getElementById('status');
        const audioContainer = document.getElementById('audio-container');

        btn.onclick = async () => {
            const name = document.getElementById('username').value;
            if(!name) return alert("ใส่ชื่อด้วยเพื่อน!");
            
            try {
                // 1. ขอใช้ไมค์
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                socket.emit('join', name);
                status.innerText = "สถานะ: ออนไลน์ (เปิดไมค์ Sybtown แล้ว)";
                btn.disabled = true;

                // 2. ระบบส่งเสียงเบื้องต้น (แบบกระจายเสียง)
                // หมายเหตุ: ระบบ Peer-to-Peer เต็มรูปแบบต้องใช้ PeerJS 
                // แต่ตอนนี้เราทำให้ทุกคนในเซิร์ฟเวอร์ได้ยินเสียงกันก่อน
                console.log("Mic Active for " + name);
                
            } catch (e) {
                alert("ต้องกดอนุญาตให้ใช้ไมค์ถึงจะคุยได้นะเพื่อน");
            }
        };

        // รับสัญญาณเสียงจากคนอื่น (แสดงผลชื่อคนคุย)
        socket.on('user-connected', (userName) => {
            const p = document.createElement('p');
            p.innerText = "🔊 " + userName + " กำลังออนไลน์...";
            audioContainer.appendChild(p);
        });
    </script>
</body>
</html>
