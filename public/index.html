<script>
    const socket = io();
    let players = {};

    socket.on('nearby_players', (allPlayers) => {
        players = allPlayers;
        calculateAudio();
    });

    function calculateAudio() {
        const myName = document.getElementById('username').value;
        const me = Object.values(players).find(p => p.name === myName);
        
        if (!me) return;

        Object.values(players).forEach(other => {
            if (other.name !== myName) {
                // สูตรหาความห่าง (Pythagoras)
                const dist = Math.sqrt(
                    Math.pow(me.x - other.x, 2) +
                    Math.pow(me.z - other.z, 2)
                );

                // ปรับความดัง: ยิ่งไกล dist ยิ่งมาก ความดัง (volume) ยิ่งน้อย
                let volume = 1 - (dist / 20); // ระยะ 20 บล็อกจะไม่ได้ยิน
                if (volume < 0) volume = 0;
                
                // สั่งหรี่เสียงเพื่อนคนนี้ในระบบเสียง
                setPlayerVolume(other.name, volume);
            }
        });
    }
</script>
